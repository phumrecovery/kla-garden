<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สนามสอบ</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#8e5bd8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet"><link rel="stylesheet" href="engine/engine.css">
<style>
#setup .stage{align-items:flex-start}
.tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tabs button{border:3px solid transparent;background:#fff;border-radius:18px;padding:10px 22px;font-size:clamp(18px,2.8vw,26px);box-shadow:0 3px 0 rgba(0,0,0,.08);color:var(--ink)}
.tabs button.on{border-color:var(--c);background:var(--bg)}
.subj{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,42vw),1fr));gap:14px;width:100%}
.subj .opt{min-height:120px}
.subj .opt .e{font-size:clamp(36px,6vw,54px)}
.subj .opt small{font-size:clamp(14px,2vw,18px);opacity:.7}
.cnt{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cnt button{border:3px solid transparent;background:#fff;border-radius:999px;padding:8px 20px;font-size:clamp(18px,2.6vw,24px);box-shadow:0 3px 0 rgba(0,0,0,.08);color:var(--ink)}
.cnt button.on{border-color:var(--c);background:var(--bg)}
.mock{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.mock .mix{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.mock .mix span{background:#fff;border-radius:999px;padding:4px 14px;font-size:clamp(15px,2.2vw,20px)}
.mock .go{font-size:clamp(22px,3.4vw,32px);padding:14px 34px}
.plink{display:block;width:100%;text-align:center;background:#fff;border-radius:18px;padding:12px;text-decoration:none;color:var(--ink);font-size:clamp(17px,2.5vw,22px);box-shadow:0 3px 0 rgba(0,0,0,.08)}
.note{font-size:clamp(13px,1.8vw,16px);opacity:.7;text-align:center}
.sw{display:flex;align-items:center;gap:8px;justify-content:center;font-size:clamp(14px,2vw,17px);opacity:.8}
.sw input{width:20px;height:20px}
</style></head><body><div id="app">
<div id="setup" style="display:contents">
<div class="top"><div class="t">🏟️ สนามสอบ</div><a href="00_เมนูหลัก.html" style="margin-left:auto;color:#fff;text-decoration:none;font-size:clamp(16px,2.4vw,22px)">🏡 กลับสวน</a></div>
<div class="stage"><div class="vis" style="max-width:900px">
<div class="row" style="align-items:center"><div class="char" style="width:110px" id="kla"></div><div class="bubble" id="msg"></div></div>
<div class="tabs" id="tabs"></div>
<div id="body" style="width:100%;display:flex;flex-direction:column;gap:14px;align-items:center"></div>
<a class="plink" href="สนามสอบ_ผู้ปกครอง.html">📊 รายงานสำหรับผู้ปกครอง</a>
<label class="sw"><input type="checkbox" id="all"> ผู้ปกครอง: เปิดทุกหัวข้อ แม้น้องยังไม่ได้ดูคลิป (ใช้ทดลอง)</label>
<p class="note" id="foot"></p>
</div></div></div></div>
<script src="คลังโจทย์.js"></script><script src="engine/focus.js"></script>
<script src="เสียง/amap.js"></script>
<script>
(function(){
const SUBJ=[['mix','คละวิชา','🎲','review'],['math','คณิตศาสตร์','🍊','math'],['thai','ภาษาไทย','📖','thai'],['logic','เชาวน์ปัญญา','🌽','logic'],['eng','ภาษาอังกฤษ','🚂','eng'],['sci','วิทยาศาสตร์','🔍','sci']];
const QUOTAS={30:[['math',8],['logic',6],['thai',6],['eng',5],['sci',5]],50:[['math',13],['logic',10],['thai',10],['eng',9],['sci',8]]};
const get=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const set=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const P=get('kla-garden-v1',{}),H=get('kla-exam-v1',[]);let all=get('kla-exam-all',false),N=get('kla-exam-n',30),MODE=get('kla-exam-mode','practice'),MN=get('kla-mock-n',30),MS=get('kla-mock-sec',15),PS=get('kla-paper-sec',2),PON=get('kla-paper-on',false);if(![2,4].includes(PS))PS=2;if(!QUOTAS[MN])MN=30;
const T=BANK.topics;
const open=t=>all||!!(P['EP'+t.ep]&&P['EP'+t.ep].seed);
/* บางข้อใช้ความรู้จากตอนหลัง (x.ep) ซ่อนไว้จนกว่าน้องจะดูตอนนั้น */
const okIt=x=>all||!x.ep||!!(P['EP'+x.ep]&&P['EP'+x.ep].seed);
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const ST={};H.slice(-10).forEach(r=>(r.items||[]).forEach(x=>{if(!x)return;const o=ST[x[1]]=ST[x[1]]||{n:0,ok:0};o.n++;o.ok+=x[2];}));
const MSTR=window.mastery?mastery():{};  /* ระดับความยากตามผลของน้อง */
const SEEN=get('kla-seen-v1',{}),cnt=x=>(SEEN[x.id]||[0])[0],last=x=>(SEEN[x.id]||[0,0])[1];
/* แนวโจทย์: ข้อความโจทย์ที่ตัดตัวเลขออก + ชนิดภาพ ใช้กันไม่ให้ชุดเดียวกันมีโจทย์แนวเดิมซ้ำ ๆ */
const stem=x=>x.t+'|'+String(x.say||x.q).replace(/[0-9๐-๙]+/g,'#')+'|'+((x.v&&x.v.type)||'');
document.getElementById('kla').innerHTML='<svg class="kla" viewBox="0 0 120 140"><g class="bodyg"><g class="leaves"><path d="M60 46 C60 34 60 28 60 22" stroke="#3f8a2e" stroke-width="5" fill="none" stroke-linecap="round"/><ellipse cx="44" cy="20" rx="16" ry="9" fill="#5cc46b" stroke="#3f8a2e" stroke-width="3" transform="rotate(-25 44 20)"/><ellipse cx="76" cy="20" rx="16" ry="9" fill="#5cc46b" stroke="#3f8a2e" stroke-width="3" transform="rotate(25 76 20)"/></g><ellipse cx="60" cy="92" rx="44" ry="42" fill="#7ed37f" stroke="#3f8a2e" stroke-width="4"/><circle cx="46" cy="84" r="7" fill="#2d2340"/><circle cx="74" cy="84" r="7" fill="#2d2340"/><circle cx="48" cy="81" r="2.5" fill="#fff"/><circle cx="76" cy="81" r="2.5" fill="#fff"/><path d="M50 102 Q60 112 70 102" stroke="#2d2340" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cx="36" cy="100" rx="7" ry="4" fill="#ff9fb0" opacity=".7"/><ellipse cx="84" cy="100" rx="7" ry="4" fill="#ff9fb0" opacity=".7"/></g></svg>';
/* สุ่ม n ข้อจากหัวข้อที่กำหนด (ทำครบทุกข้อก่อนค่อยวนซ้ำ)
   - ในแต่ละหัวข้อ ข้อที่ยังไม่เคยขึ้นมาก่อน รองลงมาคือข้อที่ขึ้นน้อยครั้งและนานแล้ว
   - หัวข้อที่ฝึกน้อยกว่ามาก่อน หัวข้อที่ตอบถูกน้อยกว่า 70% ได้โอกาสเพิ่ม
   - ในชุดเดียวกัน เลี่ยงโจทย์แนวเดียวกัน (stem) ถ้ายังมีแนวอื่นให้เลือก */
function draw(ts,n){
  /* ระดับความยากตามผลของน้อง (engine/focus.js): หัวข้อที่ทำได้ดีข้ามข้อง่าย ทำได้ดีมากเอาข้อยากก่อน ทำพลาดบ่อยพักข้อยาก
     หัวข้อที่ข้ามข้อง่ายแล้วแต่ไม่มีข้อยากกว่าเหลือ ใช้เติมเมื่อหัวข้ออื่นไม่พอ */
  const Q={},avg={},cap={};ts.forEach(t=>{const m=MSTR[t.id],lp=levelPick(BANK.items.filter(x=>x.t===t.id&&okIt(x)),m);cap[t.id]=lp.capped;
    const it=shuf(lp.pool).sort((a,b)=>levelRank(a,m)-levelRank(b,m)||cnt(a)-cnt(b)||last(a)-last(b));Q[t.id]=it;avg[t.id]=it.reduce((s,x)=>s+cnt(x),0)/Math.max(1,it.length);});
  const order=shuf(ts.slice()).sort((a,b)=>avg[a.id]-avg[b.id]);
  const rotOf=list=>{const r=[];list.forEach(t=>{r.push(t.id);const s=ST[t.id];if(s&&s.n>=3&&s.ok/s.n<.7)r.push(t.id);});return r;};
  const out=[],used=new Set();
  const fill=rot=>{for(let g=0;g<200&&out.length<n;g++){let add=false;for(const id of rot){if(out.length>=n)break;const q=Q[id];if(!q.length)continue;
    const c0=cnt(q[0]);let i=q.findIndex(x=>cnt(x)===c0&&!used.has(stem(x)));if(i<0)i=0;const x=q.splice(i,1)[0];used.add(stem(x));out.push(x);add=true;}if(!add)break;}};
  fill(rotOf(order.filter(t=>!cap[t.id])));if(out.length<n)fill(rotOf(order));
  return shuf(out);}
/* ความคืบหน้า: ทำไปแล้วกี่ข้อ จากข้อทั้งหมดในหัวข้อที่เปิดแล้ว */
const cover=ts=>{const it=BANK.items.filter(x=>ts.some(t=>t.id===x.t)&&okIt(x));return [it.filter(x=>cnt(x)>0).length,it.length];};
const openOf=subj=>T.filter(t=>open(t)&&(subj==='mix'||t.subj===subj));
/* จำลองสอบ 30 ข้อ: คณิต 8 เชาวน์ 6 ไทย 6 อังกฤษ 5 วิทย์ 5 · 50 ข้อ: 13/10/10/9/8 (พัก 10 วิหลังข้อ 25)
   เรียงเป็นตอนตามวิชา วิชาที่ยังไม่เปิดยกโควตาให้วิชาอื่น */
function mockSet(){const QUOTA=QUOTAS[MN];const q={};let left=0;QUOTA.forEach(([s,n])=>{if(openOf(s).length)q[s]=n;else left+=n;});const ks=Object.keys(q);if(!ks.length)return [];
  for(let i=0;left>0;i++,left--)q[ks[i%ks.length]]++;
  return QUOTA.filter(([s])=>q[s]).flatMap(([s])=>draw(openOf(s),q[s]));}
function launch(mode,subj,qs,warm){if(!qs.length)return;const s=SUBJ.find(x=>x[0]===subj);
  window.EP={mode,sec:MS,paper:warm||!PON?0:PS,warm:!!warm,autostart:true,title:warm?'🔢 คณิตวันละนิด':mode==='mock'?'จำลองสอบ '+qs.length+' ข้อ':'สนามสอบ · '+s[1],subject:mode==='mock'?'ready':s[3],subj,level:'',scenes:[],questions:qs,summary:'',menu:'00_เมนูหลัก.html',audioDir:'เสียง/'};
  document.getElementById('app').innerHTML='';const e=document.createElement('script');e.src='engine/engine.js';document.body.append(e);}
function render(){
  const tb=document.getElementById('tabs');tb.innerHTML='';[['practice','📝 โหมดฝึก'],['mock','🏫 จำลองสอบ']].forEach(([m,l])=>{const b=document.createElement('button');b.textContent=l;b.className=m===MODE?'on':'';b.onclick=()=>{MODE=m;set('kla-exam-mode',m);render();};tb.append(b);});
  const body=document.getElementById('body');body.innerHTML='';const any=T.some(open);
  if(MODE==='practice'){
    const sb=document.createElement('div');sb.className='subj';
    SUBJ.forEach(([id,name,emo])=>{const ts=openOf(id);const b=document.createElement('button');b.className='opt pop';b.disabled=!ts.length;
      const cv=cover(ts);b.innerHTML='<div class="e">'+emo+'</div><div class="T">'+name+'</div><small>'+(ts.length?ts.length+' หัวข้อ · ทำแล้ว '+cv[0]+'/'+cv[1]:'ยังไม่ได้ดูคลิป')+'</small>';b.onclick=()=>launch('practice',id,draw(ts,N));sb.append(b);});
    body.append(sb);
    const c=document.createElement('div');c.className='cnt';c.innerHTML='<span class="T" style="align-self:center">ชุดละ</span>';
    [10,20,30,50].forEach(n=>{const b=document.createElement('button');b.textContent=n+' ข้อ';b.className=n===N?'on':'';b.onclick=()=>{N=n;set('kla-exam-n',n);render();};c.append(b);});body.append(c);
    document.getElementById('msg').textContent=any?'เลือกวิชาที่อยากฝึกได้เลย':'ไปดูคลิปในสวนก่อนนะ แล้วค่อยกลับมาฝึก';
    document.getElementById('foot').textContent='โหมดฝึกมีคำใบ้และเฉลยทุกข้อ · ข้อที่ยังไม่เคยทำจะถูกสุ่มก่อน ทำครบแล้วค่อยวนรอบใหม่ · ชุด 50 ข้อมีพัก 10 วินาทีหลังข้อ 25';
  }else{
    const qs=mockSet();const cnt={};qs.forEach(x=>{const s=(T.find(t=>t.id===x.t)||{}).subj;cnt[s]=(cnt[s]||0)+1;});
    const m=document.createElement('div');m.className='mock';
    m.innerHTML='<div class="card" style="width:100%"><div class="T"><b>ทำข้อสอบเหมือนวันสอบจริง</b></div><div class="T" style="font-size:clamp(15px,2.2vw,20px)">คุณครูดอกม่วงอ่านโจทย์และตัวเลือกให้ฟังข้อละ 2 รอบ · หมดเวลาแล้วไปข้อต่อไปทันที · ตอบได้ครั้งเดียว · ไม่มีเฉลยระหว่างทำ · รู้ผลตอนจบ</div></div>'+
      '<div class="mix">'+QUOTAS[MN].filter(([s])=>cnt[s]).map(([s])=>{const x=SUBJ.find(y=>y[0]===s);return '<span>'+x[2]+' '+x[1]+' '+cnt[s]+' ข้อ</span>';}).join('')+'</div>';
    const c=document.createElement('div');c.className='cnt';[30,50].forEach(n=>{const b=document.createElement('button');b.textContent=n+' ข้อ'+(n===50?' (มีพักครึ่งทาง)':'');b.className=n===MN?'on':'';b.onclick=()=>{MN=n;set('kla-mock-n',n);render();};c.append(b);});m.append(c);
    const c2=document.createElement('div');c2.className='cnt';c2.innerHTML='<span class="T" style="align-self:center">⏰ เวลาคิดข้อละ</span>';[10,15,20,30].forEach(n=>{const b=document.createElement('button');b.textContent=n+' วิ';b.className=n===MS?'on':'';b.onclick=()=>{MS=n;set('kla-mock-sec',n);render();};c2.append(b);});m.append(c2);
    const g=document.createElement('button');g.className='go pop';g.textContent='▶ เริ่มทำ '+qs.length+' ข้อ';g.disabled=!qs.length;g.onclick=()=>launch('mock','mix',qs);m.append(g);body.append(m);
    document.getElementById('msg').textContent=any?(qs.length<MN?'ตอนนี้มีโจทย์จากเรื่องที่ดูแล้ว '+qs.length+' ข้อ':'พร้อมสอบแล้วใช่ไหม สู้ ๆ นะ'):'ไปดูคลิปในสวนก่อนนะ แล้วค่อยกลับมาสอบ';
    document.getElementById('foot').textContent='แนะนำทำสัปดาห์ละครั้ง ในที่เงียบ ๆ ให้น้องทำเองทั้งชุด';
  }
  /* รอบนี้ใช้กระดาษคำตอบไหม: ใช้ → หลังตอบแต่ละข้อมีเวลากากบาทลงกระดาษ (2/4 วิ) · ไม่ใช้ → ไปข้อต่อไปทันที */
  const pp=document.createElement('div');pp.className='cnt';pp.innerHTML='<span class="T" style="align-self:center">📝 รอบนี้</span>';
  [[false,'ไม่มีกระดาษคำตอบ'],[true,'✏️ มีกระดาษคำตอบ']].forEach(([v,l])=>{const b=document.createElement('button');b.textContent=l;b.className=v===PON?'on':'';b.onclick=()=>{PON=v;set('kla-paper-on',v);render();};pp.append(b);});
  const top=[pp];
  if(PON){const p2=document.createElement('div');p2.className='cnt';p2.innerHTML='<span class="T" style="align-self:center">เวลากากบาทหลังตอบข้อละ</span>';[2,4].forEach(n=>{const b=document.createElement('button');b.textContent=n+' วิ';b.className=n===PS?'on':'';b.onclick=()=>{PS=n;set('kla-paper-sec',n);render();};p2.append(b);});top.push(p2);}
  body.prepend(...top);
  const a=document.getElementById('all');a.checked=all;a.onchange=()=>{all=a.checked;set('kla-exam-all',all);render();};}
/* #warm = คณิตวันละนิด 5 ข้อ (เปิดจากหน้าสวน) */
if(location.hash==='#warm'){const qs=pickFocus(5);if(qs.length)launch('practice','math',qs,true);else render();}else render();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script></body></html>
